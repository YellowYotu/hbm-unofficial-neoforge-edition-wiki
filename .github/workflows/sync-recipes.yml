name: Synchronize mod recipes
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_recipes.py'
      - '.github/workflows/sync-recipes.yml'
  schedule:
    - cron: '20 5 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_recipes.py
      - name: Commit new recipe data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/wiki/recipes.generated.json
          if ! git diff --cached --quiet; then
            git commit -m "docs: synchronize recipes with current mod sources"
            git push
          fi
